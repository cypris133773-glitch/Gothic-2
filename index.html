<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GRIMWARD</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The canvas is the game. Everything in the DOM besides it is a fallback, an
     overlay, or a piece of chrome the canvas cannot draw (text input, links). -->
<canvas id="view"></canvas>

<!-- Shown when the capability gate refuses the machine. It is plain DOM on
     purpose: if we are here, we cannot rely on being able to draw anything. -->
<div id="gate" hidden>
  <h1>GRIMWARD cannot run here</h1>
  <p id="gate-why"></p>
</div>

<div id="overlay"></div>

<!-- The one loading screen in the game, and it is at the one place where there
     is genuinely another world to load: the pass. Everything on the island
     streams, so this never appears while walking. -->
<div id="loading" hidden>
  <h2 id="loading-where"></h2>
  <p id="loading-note"></p>
</div>

<!-- Death. Held for a moment before anything is offered: being killed and
     handed a menu in the same frame reads as a bug rather than as a death. -->
<div id="died" hidden>
  <h2>You are dead</h2>
  <p id="died-where"></p>
  <ul id="died-options">
    <li><b>F9</b> load your last save</li>
    <li><b>Enter</b> wake up — half a day and a quarter of your purse</li>
  </ul>
</div>

<!-- Conversations are text, and text is what the DOM is for. The canvas draws
     the world; a talking-head panel over it is one element and reflows itself
     on a phone, which a canvas-drawn one would not. -->
<div id="talk" hidden>
  <p id="talk-who"></p>
  <p id="talk-reply"></p>
  <ol id="talk-options"></ol>
  <p id="talk-hint">1–9 to speak · T to train · Esc to end</p>
</div>

<!-- The character's own screens: what he is carrying, what he has been asked to
     do, and what he has spent his learning points on. One panel, three tabs,
     because they are read together — "can I afford that sword yet" is a
     question about the inventory and the sheet at the same time. -->
<div id="book" hidden>
  <nav id="book-tabs">
    <button data-tab="sheet">Character <b>C</b></button>
    <button data-tab="pack">Pack <b>I</b></button>
    <button data-tab="log">Log <b>J</b></button>
    <button data-tab="runes">Runes <b>K</b></button>
  </nav>
  <div id="book-body"></div>
  <p id="book-hint"></p>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
